name: Android Build CI

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Esto acelera builds futuros

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # React Native + pnpm a veces necesita generar el bundle de JS manualmente 
      # antes de que Gradle lo empaquete.
      - name: Build Android Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Subir APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: bco-bolivariano-app-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk